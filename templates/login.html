
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CondoFace - Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/login.css') }}"
    >
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <div class="logo">
                <span>CF</span>
            </div>

            <h1>CondoFace</h1>

            <p class="subtitulo">
                Acesso administrativo
            </p>

            {% if erro %}
                <div class="mensagem-erro" role="alert">
                    {{ erro }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button type="submit">
                    Entrar no sistema
                </button>

            </form>

            <p class="rodape">
                CondoFace - Controle de Acesso
            </p>

        </div>

    </main>

</body>
</html>
